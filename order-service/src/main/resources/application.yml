server:
  port: 9097

spring:
  application:
    name: order-service
  datasource:
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRES_USER:caglar}
    password: ${POSTGRES_PASSWORD:root}
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/orderdb
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

security:
  jwt:
    secret: ${JWT_SECRET:bootcamp-n11-jwt-secret-please-change-in-production-please}

app:
  security:
    mode: downstream

openapi:
  title: Order Service API
  version: v1
  description: Sipariş yönetimi (PENDING → PAID → SHIPPED → DELIVERED, iptal/fail)

management:
  endpoints:
    web:
      exposure:
        include: health,info
