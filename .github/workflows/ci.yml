name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      service:
        description: 'Hangi servis deploy edilsin?'
        required: true
        type: choice
        options:
          - all
          - auth-service
          - user-service
          - product-service
          - basket-service
          - order-service
          - payment-service
          - notification-service
          - stock-service
          - gateway-service
        default: 'all'
      environment:
        description: 'Ortam'
        required: true
        type: choice
        options:
          - staging
          - prod
        default: 'staging'

permissions:
  contents: read
  id-token: write
  pull-requests: read

env:
  PROJECT_ID: n11-patika-final
  REGION: europe-west1
  REGISTRY: europe-west1-docker.pkg.dev/n11-patika-final/n11-images

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.compute.outputs.services }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            auth-service: ['auth-service/**', 'common-lib/**']
            user-service: ['user-service/**', 'common-lib/**']
            product-service: ['product-service/**', 'common-lib/**']
            basket-service: ['basket-service/**', 'common-lib/**']
            order-service: ['order-service/**', 'common-lib/**']
            payment-service: ['payment-service/**', 'common-lib/**']
            notification-service: ['notification-service/**', 'common-lib/**']
            stock-service: ['stock-service/**', 'common-lib/**']
            gateway-service: ['gateway-service/**', 'common-lib/**']
            discovery-service: ['discovery-service/**', 'common-lib/**']
      - id: compute
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.service }}" = "all" ]; then
              echo 'services=["auth-service","user-service","product-service","basket-service","order-service","payment-service","notification-service","stock-service","gateway-service"]' >> $GITHUB_OUTPUT
            else
              echo 'services=["${{ inputs.service }}"]' >> $GITHUB_OUTPUT
            fi
          else
            echo 'services=${{ steps.filter.outputs.changes }}' >> $GITHUB_OUTPUT
          fi

  build-test:
    needs: detect-changes
    if: needs.detect-changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Install parent POM
        run: mvn -N install -DskipTests
      - name: Build common-lib
        run: mvn -pl common-lib install -DskipTests
      - name: Test
        run: mvn -pl ${{ matrix.service }} -am test
      - name: Build with Jib (main/develop only)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
      - name: Jib build & push
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        run: |
          mvn -pl ${{ matrix.service }} -am compile -DskipTests
          mvn -pl ${{ matrix.service }} jib:build -DskipTests

  deploy-staging:
    needs: [ detect-changes, build-test ]
    if: (github.ref == 'refs/heads/develop' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')) && needs.detect-changes.outputs.services != '[]' && needs.detect-changes.outputs.services != ''
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy to Cloud Run (staging)
        if: matrix.service != 'discovery-service' && matrix.service != 'gateway-service'
        run: |
          case "${{ matrix.service }}" in
            user-service)    MONGO_SECRET=MONGODB_URI_USER ;;
            product-service) MONGO_SECRET=MONGODB_URI_PRODUCT ;;
            *)               MONGO_SECRET=MONGODB_URI ;;
          esac
          EXTRA_ENV_VARS=""
          EXTRA_SECRETS=""
          if [ "${{ matrix.service }}" = "payment-service" ]; then
            SVC_URL=$(gcloud run services describe ${{ matrix.service }}-staging --region=${{ env.REGION }} --format='value(status.url)' 2>/dev/null || echo "")
            EXTRA_ENV_VARS=",IYZICO_CALLBACK_URL=${SVC_URL}/dev/v1/payment/iyzico/callback,IYZICO_SUCCESS_REDIRECT=https://sepetify-shop.vercel.app/orders/{orderId}/result,IYZICO_FAILURE_REDIRECT=https://sepetify-shop.vercel.app/orders/{orderId}/result,IYZICO_BASE_URL=https://sandbox-api.iyzipay.com"
            EXTRA_SECRETS=",IYZICO_API_KEY=IYZICO_API_KEY:latest,IYZICO_SECRET_KEY=IYZICO_SECRET_KEY:latest"
          fi
          KAFKA_SECRETS=",KAFKA_BOOTSTRAP_SERVERS=KAFKA_BOOTSTRAP_SERVERS:latest,KAFKA_API_KEY=KAFKA_API_KEY:latest,KAFKA_API_SECRET=KAFKA_API_SECRET:latest"
          if [ "${{ matrix.service }}" = "notification-service" ]; then
            EXTRA_SECRETS="${EXTRA_SECRETS},MAIL_USERNAME=MAIL_USERNAME:latest,MAIL_PASSWORD=MAIL_PASSWORD:latest,SLACK_WEBHOOK_URL=SLACK_WEBHOOK_URL:latest"
            KAFKA_SECRETS=""
          fi
          MIN_INSTANCES=1
          if [ "${{ matrix.service }}" = "discovery-service" ]; then
            MIN_INSTANCES=0
          fi
          gcloud run deploy ${{ matrix.service }}-staging \
            --image=${{ env.REGISTRY }}/${{ matrix.service }}:latest \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --add-cloudsql-instances=n11-patika-final:europe-west1:n11-postgres \
            --set-env-vars="SPRING_PROFILES_ACTIVE=staging,SERVER_PORT=8080${EXTRA_ENV_VARS}" \
            --set-secrets="JWT_SECRET=JWT_SECRET:latest,DB_USER_PASSWORD=DB_USER_PASSWORD:latest,MONGODB_URI=${MONGO_SECRET}:latest,REDIS_HOST=REDIS_HOST:latest,CLOUD_SQL_CONNECTION_NAME=CLOUD_SQL_CONNECTION_NAME:latest${KAFKA_SECRETS}${EXTRA_SECRETS}" \
            --vpc-egress=private-ranges-only \
            --min-instances=${MIN_INSTANCES} \
            --memory=1Gi \
            --cpu=1 \
            --timeout=300 \
            --cpu-boost
      - name: Notify Slack
        if: always() && env.SLACK_WEBHOOK_URL != '' && matrix.service != 'gateway-service' && matrix.service != 'discovery-service'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data '{"text":"[${{ matrix.service }}] staging deploy: ${{ job.status }} 🚀"}' \
            "$SLACK_WEBHOOK_URL"

  deploy-staging-gateway:
    needs: [ detect-changes, deploy-staging ]
    if: (github.ref == 'refs/heads/develop' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')) && contains(needs.detect-changes.outputs.services, 'gateway-service')
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy gateway with downstream URLs (staging)
        run: |
          get_url() { gcloud run services describe "$1-staging" --region=${{ env.REGION }} --format='value(status.url)' 2>/dev/null || echo ""; }
          AUTH_URL=$(get_url auth-service)
          USER_URL=$(get_url user-service)
          PRODUCT_URL=$(get_url product-service)
          BASKET_URL=$(get_url basket-service)
          ORDER_URL=$(get_url order-service)
          PAYMENT_URL=$(get_url payment-service)
          NOTIFICATION_URL=$(get_url notification-service)
          STOCK_URL=$(get_url stock-service)
          gcloud run deploy gateway-service-staging \
            --image=${{ env.REGISTRY }}/gateway-service:latest \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --set-env-vars="SPRING_PROFILES_ACTIVE=staging,SERVER_PORT=8080,AUTH_SERVICE_URL=${AUTH_URL},USER_SERVICE_URL=${USER_URL},PRODUCT_SERVICE_URL=${PRODUCT_URL},BASKET_SERVICE_URL=${BASKET_URL},ORDER_SERVICE_URL=${ORDER_URL},PAYMENT_SERVICE_URL=${PAYMENT_URL},NOTIFICATION_SERVICE_URL=${NOTIFICATION_URL},STOCK_SERVICE_URL=${STOCK_URL}" \
            --set-secrets="JWT_SECRET=JWT_SECRET:latest,REDIS_HOST=REDIS_HOST:latest" \
            --vpc-egress=private-ranges-only \
            --min-instances=1 \
            --memory=512Mi \
            --cpu=1

  deploy-prod:
    needs: [ detect-changes, build-test ]
    if: (github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'prod')) && needs.detect-changes.outputs.services != '[]' && needs.detect-changes.outputs.services != ''
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy to Cloud Run (prod)
        if: matrix.service != 'discovery-service' && matrix.service != 'gateway-service'
        run: |
          case "${{ matrix.service }}" in
            user-service)    MONGO_SECRET=MONGODB_URI_USER ;;
            product-service) MONGO_SECRET=MONGODB_URI_PRODUCT ;;
            *)               MONGO_SECRET=MONGODB_URI ;;
          esac
          EXTRA_ENV_VARS=""
          EXTRA_SECRETS=""
          if [ "${{ matrix.service }}" = "payment-service" ]; then
            SVC_URL=$(gcloud run services describe ${{ matrix.service }} --region=${{ env.REGION }} --format='value(status.url)' 2>/dev/null || echo "")
            EXTRA_ENV_VARS=",IYZICO_CALLBACK_URL=${SVC_URL}/dev/v1/payment/iyzico/callback,IYZICO_SUCCESS_REDIRECT=https://sepetify-shop.vercel.app/orders/{orderId}/result,IYZICO_FAILURE_REDIRECT=https://sepetify-shop.vercel.app/orders/{orderId}/result,IYZICO_BASE_URL=https://sandbox-api.iyzipay.com"
            EXTRA_SECRETS=",IYZICO_API_KEY=IYZICO_API_KEY:latest,IYZICO_SECRET_KEY=IYZICO_SECRET_KEY:latest"
          fi
          KAFKA_SECRETS=",KAFKA_BOOTSTRAP_SERVERS=KAFKA_BOOTSTRAP_SERVERS:latest,KAFKA_API_KEY=KAFKA_API_KEY:latest,KAFKA_API_SECRET=KAFKA_API_SECRET:latest"
          if [ "${{ matrix.service }}" = "notification-service" ]; then
            EXTRA_SECRETS="${EXTRA_SECRETS},MAIL_USERNAME=MAIL_USERNAME:latest,MAIL_PASSWORD=MAIL_PASSWORD:latest,SLACK_WEBHOOK_URL=SLACK_WEBHOOK_URL:latest"
            KAFKA_SECRETS=""
          fi
          MIN_INSTANCES=1
          if [ "${{ matrix.service }}" = "discovery-service" ]; then
            MIN_INSTANCES=0
          fi
          gcloud run deploy ${{ matrix.service }} \
            --image=${{ env.REGISTRY }}/${{ matrix.service }}:latest \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --add-cloudsql-instances=n11-patika-final:europe-west1:n11-postgres \
            --set-env-vars="SPRING_PROFILES_ACTIVE=prod,SERVER_PORT=8080${EXTRA_ENV_VARS}" \
            --set-secrets="JWT_SECRET=JWT_SECRET:latest,DB_USER_PASSWORD=DB_USER_PASSWORD:latest,MONGODB_URI=${MONGO_SECRET}:latest,REDIS_HOST=REDIS_HOST:latest,CLOUD_SQL_CONNECTION_NAME=CLOUD_SQL_CONNECTION_NAME:latest${KAFKA_SECRETS}${EXTRA_SECRETS}" \
            --vpc-egress=private-ranges-only \
            --min-instances=${MIN_INSTANCES} \
            --memory=1Gi \
            --cpu=1 \
            --timeout=300 \
            --cpu-boost
      - name: Notify Slack
        if: always() && env.SLACK_WEBHOOK_URL != '' && matrix.service != 'gateway-service' && matrix.service != 'discovery-service'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data '{"text":"[${{ matrix.service }}] PROD deploy: ${{ job.status }} 🎉"}' \
            "$SLACK_WEBHOOK_URL"

  deploy-prod-gateway:
    needs: [ detect-changes, deploy-prod ]
    if: (github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'prod')) && contains(needs.detect-changes.outputs.services, 'gateway-service')
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy gateway with downstream URLs (prod)
        run: |
          get_url() { gcloud run services describe "$1" --region=${{ env.REGION }} --format='value(status.url)' 2>/dev/null || echo ""; }
          AUTH_URL=$(get_url auth-service)
          USER_URL=$(get_url user-service)
          PRODUCT_URL=$(get_url product-service)
          BASKET_URL=$(get_url basket-service)
          ORDER_URL=$(get_url order-service)
          PAYMENT_URL=$(get_url payment-service)
          NOTIFICATION_URL=$(get_url notification-service)
          STOCK_URL=$(get_url stock-service)
          gcloud run deploy gateway-service \
            --image=${{ env.REGISTRY }}/gateway-service:latest \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --set-env-vars="SPRING_PROFILES_ACTIVE=prod,SERVER_PORT=8080,AUTH_SERVICE_URL=${AUTH_URL},USER_SERVICE_URL=${USER_URL},PRODUCT_SERVICE_URL=${PRODUCT_URL},BASKET_SERVICE_URL=${BASKET_URL},ORDER_SERVICE_URL=${ORDER_URL},PAYMENT_SERVICE_URL=${PAYMENT_URL},NOTIFICATION_SERVICE_URL=${NOTIFICATION_URL},STOCK_SERVICE_URL=${STOCK_URL}" \
            --set-secrets="JWT_SECRET=JWT_SECRET:latest,REDIS_HOST=REDIS_HOST:latest" \
            --vpc-egress=private-ranges-only \
            --min-instances=1 \
            --memory=512Mi \
            --cpu=1
