server:
  port: 8080
spring:
  data:
    mongodb:
      uri: ${MONGODB_URI}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      auto-startup: false
      missing-topics-fatal: false
    admin:
      fail-fast: false
      auto-create: false
    producer:
      properties:
        max.block.ms: 5000
        delivery.timeout.ms: 10000
eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
