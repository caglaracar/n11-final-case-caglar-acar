server:
  port: 9097

spring:
  application:
    name: stock-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/StockDB}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

app:
  security:
    mode: open

openapi:
  title: Stock Service API
  version: v1
  description: Stok rezervasyon ve yönetimi

management:
  endpoints:
    web:
      exposure:
        include: health,info
